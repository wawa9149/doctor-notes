version: "3.8"

services:
  # ChromaDB 서버 (벡터 데이터베이스)
  chromadb:
    image: chromadb/chroma:latest
    container_name: doctor-notes-chromadb
    ports:
      - "8003:8000"
    environment:
      - CHROMA_SERVER_AUTH_PROVIDER=none
      - CHROMA_SERVER_AUTH_CREDENTIALS_PROVIDER=none
      - ANONYMIZED_TELEMETRY=false
    volumes:
      - chromadb-data:/chroma/chroma
    networks:
      - mago-services
    restart: unless-stopped
    # healthcheck 임시 비활성화 - ChromaDB가 자체적으로 헬스체크 엔드포인트를 제공하지 않음
    # healthcheck:
    #   test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/api/v1')"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 5
    #   start_period: 40s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # 필요시 빌드 ARG 추가
      # args:
      #   ENV: production
    container_name: doctor-notes-backend
    command: >
      uvicorn app.main:app
      --host 0.0.0.0 --port 8000
      --workers 2
    ports:
      - "8002:8000"
    depends_on:
      rag-service:
        condition: service_healthy
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=sqlite:////app/data/emr.db
      - AZURE_API_KEY=${AZURE_API_KEY}
      - AZURE_ENDPOINT=${AZURE_ENDPOINT}
      - AZURE_API_VERSION=${AZURE_API_VERSION:-2024-02-01}
      - AZURE_DEPLOYMENT_NAME=${AZURE_DEPLOYMENT_NAME}
      - MAGOV_API_KEY=${MAGOV_API_KEY}
      - RAG_SERVICE_URL=${RAG_SERVICE_URL}
    volumes:
      - ./backend/data/sqlite:/app/data
    networks:
      - mago-services
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python - <<'PY'\nimport sys, urllib.request\n\
          try:\n  urllib.request.urlopen('http://localhost:8000/health', timeout=3)\n  sys.exit(0)\n\
          except Exception:\n  sys.exit(1)\nPY",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # prod에서는 소스 마운트 지양 (이미지에 포함)
    # dev용은 profiles 아래에 따로 분리

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # Dockerfile이 multi-stage면 target 지정 가능
      # target: runner
    container_name: doctor-notes-frontend
    ports:
      - "8004:3000"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # 브라우저에서 접근할 때는 상대 경로 사용
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8002
      - NODE_ENV=production
    networks:
      - mago-services
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  rag-service:
    build:
      context: ./backend
      dockerfile: Dockerfile.rag
    container_name: doctor-notes-rag
    ports:
      - "8001:8001"
    depends_on:
      - chromadb
    environment:
      - PYTHONPATH=/app
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      # Azure OpenAI 설정
      - AZURE_API_KEY=${AZURE_API_KEY}
      - AZURE_ENDPOINT=${AZURE_ENDPOINT}
      - AZURE_API_VERSION=${AZURE_API_VERSION:-2024-02-01}
      - AZURE_DEPLOYMENT_NAME=${AZURE_DEPLOYMENT_NAME}
      # 임베딩 모델 설정
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-jhgan/ko-sroberta-multitask}
      - EMBEDDING_MODEL_PATH=/opt/models/ko-sroberta
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      # 검색 및 청킹 설정
      - RETRIEVAL_TOP_K=5
      - RETRIEVAL_TOP_M=3
      - CHUNK_SIZE=500
      - CHUNK_OVERLAP=50
    volumes:
      # 개발 중 코드 변경사항 실시간 반영
      - ./backend/app/rag:/app/app/rag:ro
      # 모델 볼륨 (호스트 → 컨테이너)
      - ./backend/app/rag/models/ko-sroberta:/opt/models/ko-sroberta:ro
      # Chroma 퍼시스트 볼륨
      - ./backend/data/embeddings:/app/data/embeddings
    networks:
      - mago-services
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python - <<'PY'\nimport sys, urllib.request\n\
          try:\n  urllib.request.urlopen('http://localhost:8001/health', timeout=3)\n  sys.exit(0)\n\
          except Exception:\n  sys.exit(1)\nPY",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  mago-services:
    external: true
    name: mago-services

volumes:
  chromadb-data:
    driver: local
