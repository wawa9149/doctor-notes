version: "3.8"

services:
  # ChromaDB 서버 (벡터 데이터베이스)
  chromadb:
    image: chromadb/chroma:latest
    container_name: doctor-notes-chromadb
    ports:
      - "8003:8000"
    environment:
      - CHROMA_SERVER_AUTH_PROVIDER=none
      - CHROMA_SERVER_AUTH_CREDENTIALS_PROVIDER=none
      - ANONYMIZED_TELEMETRY=false
    volumes:
      - chromadb-data:/chroma/chroma
    networks:
      - doctor-notes-network
    restart: unless-stopped
    # healthcheck 임시 비활성화 - ChromaDB가 자체적으로 헬스체크 엔드포인트를 제공하지 않음
    # healthcheck:
    #   test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/api/v1')"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 5
    #   start_period: 40s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # 필요시 빌드 ARG 추가
      # args:
      #   ENV: production
    container_name: doctor-notes-backend
    command: >
      uvicorn app.main:app
      --host 0.0.0.0 --port 8000
      --workers 2
    ports:
      - "8002:8000"
    depends_on:
      rag-service:
        condition: service_healthy
    environment:
      - PYTHONPATH=/app
      - RAG_SERVICE_URL=http://rag-service:8001
      # CORS를 최소화하려면 프론트가 같은 오리진으로 프록시하거나,
      # 백엔드에서 허용오리진을 ENV로 관리
      # - ALLOW_ORIGINS=http://localhost,http://example.com
    networks:
      - doctor-notes-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # prod에서는 소스 마운트 지양 (이미지에 포함)
    # dev용은 profiles 아래에 따로 분리

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # Dockerfile이 multi-stage면 target 지정 가능
      # target: runner
    container_name: doctor-notes-frontend
    ports:
      - "80:3000"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # 프론트에서 백엔드 접근은 서비스명 DNS를 사용 (같은 네트워크)
      - NEXT_PUBLIC_API_BASE_URL=http://backend:8000
      - NODE_ENV=production
    networks:
      - doctor-notes-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  rag-service:
    build:
      context: ./backend
      dockerfile: Dockerfile.rag
    container_name: doctor-notes-rag
    ports:
      - "8001:8001"
    depends_on:
      - chromadb
    environment:
      - PYTHONPATH=/app
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - LLM_MODEL=${LLM_MODEL:-gpt-4}
      - LLM_API_KEY=${LLM_API_KEY}
      - EMBEDDING_MODEL_PATH=/opt/models/ko-sroberta
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - RETRIEVAL_TOP_K=5
      - RETRIEVAL_TOP_M=3
      - CHUNK_SIZE=500
      - CHUNK_OVERLAP=50
    volumes:
      # 개발 중 코드 변경사항 실시간 반영
      - ./backend/app/rag:/app/app/rag:ro
      # 모델 볼륨 (호스트 → 컨테이너)
      - ./backend/app/rag/models/ko-sroberta:/opt/models/ko-sroberta:ro
      # Chroma 퍼시스트 볼륨
      - ./backend/data/embeddings:/app/data/embeddings
    networks:
      - doctor-notes-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  doctor-notes-network:
    driver: bridge

volumes:
  chromadb-data:
    driver: local
